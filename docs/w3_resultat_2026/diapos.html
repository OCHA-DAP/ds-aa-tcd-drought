<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Fenêtre 3 (biomasse) — diapositives · Tchad AA sécheresse</title>
<style>

:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb;
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --baseline: #c3c2b7; --border: rgba(11,11,11,0.10);
  --good: #0ca30c; --critical: #d03b3b;
  --banner-bg: #fdf6ec; --banner-border: #b97f10; --shade: #111;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #161615; --surface: #1f1f1e;
    --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --baseline: #383835; --border: rgba(255,255,255,0.10);
    --banner-bg: #241c0c; --banner-border: #b97f10; --shade: #000;
  }
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink);
  font: 15.5px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: 24px; }
main { max-width: 640px; width: 100%; }
.kicker { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em;
  color: var(--muted); margin: 0 0 8px; }
h1 { font-size: 1.7rem; margin: 0 0 10px; line-height: 1.25; }
p { color: var(--ink-2); margin: 0 0 12px; }
.btns { display: flex; gap: 12px; flex-wrap: wrap; margin: 22px 0 18px; }
.btn { display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
  border-radius: 10px; padding: 11px 20px; font-weight: 600; font-size: .98rem; }
.btn-primary { background: var(--ink); color: var(--page); }
.btn-primary:hover { opacity: .85; }
.btn-secondary { border: 1.5px solid var(--ink); color: var(--ink); }
.btn-secondary:hover { background: var(--surface); }
.btn small { font-weight: 400; opacity: .7; }
.note { background: var(--banner-bg); border: 1.5px solid var(--banner-border);
  border-radius: 10px; padding: 10px 16px; font-size: .88rem; margin: 0 0 18px; }
.foot { font-size: .8rem; color: var(--muted); border-top: 1px solid var(--grid);
  padding-top: 12px; margin-top: 8px; }
a { color: inherit; }

.gate{max-width:440px; width:100%;}
.gate form{display:flex; gap:10px; margin:18px 0 10px;}
.gate input{flex:1; font:inherit; padding:10px 12px; border-radius:8px; border:1.5px solid var(--baseline);
  background:var(--surface); color:var(--ink);}
.gate input:focus{outline:2px solid var(--ink); outline-offset:1px;}
.gate button{font:inherit; font-weight:600; padding:10px 18px; border-radius:8px; border:0;
  background:var(--ink); color:var(--page); cursor:pointer;}
.gate button:disabled{opacity:.5; cursor:wait;}
.err{color:var(--critical); font-size:.9rem; min-height:1.3em; margin:0;}
.lock{font-size:.85rem; color:var(--muted); margin:0;}
[hidden]{display:none !important;}
</style>
</head>
<body>
<main id="main">
<a class="homelink" href="../">&larr; ds-aa-tcd-drought &middot; rapports</a>
<div class="gate" id="gate">
<p class="kicker">Tchad &middot; Cadre d’action anticipatoire sécheresse &middot; OCHA</p>
<h1>Fenêtre&#160;3 — résultat 2026</h1>
<p>Ce contenu n’est pas encore public. Saisissez le mot de passe pour l’ouvrir.</p>
<form id="f" autocomplete="off">
  <input id="pw" type="password" placeholder="Mot de passe" aria-label="Mot de passe" required>
  <button id="go" type="submit">Ouvrir</button>
</form>
<p class="err" id="err" role="alert"></p>
<p class="lock">Le contenu est chiffré dans la page et déchiffré dans votre navigateur&#8202;; rien n’est envoyé à un serveur.</p>
</div>

</main>
<script>
var ITER=300000;
function b64(s){var b=atob(s.replace(/\s+/g,"")),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
async function deriveKey(pw,salt){
  var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:ITER,hash:'SHA-256'},km,
    {name:'AES-GCM',length:256},false,['decrypt']);
}
var _key=null;
async function decryptFile(name,pw){
  var raw=b64(await (await fetch(name,{cache:'force-cache'})).text());
  var salt=raw.slice(0,16),iv=raw.slice(16,28),ct=raw.slice(28);
  if(!_key) _key=await deriveKey(pw,salt);
  return crypto.subtle.decrypt({name:'AES-GCM',iv:iv},_key,ct);
}
function wire(onOk){
  var f=document.getElementById('f'),inp=document.getElementById('pw'),btn=document.getElementById('go'),err=document.getElementById('err');
  async function attempt(pw,fromStore){
    btn.disabled=true; err.textContent='';
    try{ await onOk(pw); sessionStorage.setItem('w3pw',pw); }
    catch(e){ _key=null; sessionStorage.removeItem('w3pw');
      if(!fromStore){ err.textContent='Mot de passe incorrect.'; inp.select(); }
      document.getElementById('gate').hidden=false; }
    btn.disabled=false;
  }
  f.addEventListener('submit',function(e){e.preventDefault(); attempt(inp.value,false);});
  var st=null; try{ st=sessionStorage.getItem('w3pw'); }catch(e){}
  if(st){ document.getElementById('gate').hidden=true; attempt(st,true); } else { inp.focus(); }
}

wire(async function(pw){
  var html=new TextDecoder().decode(await decryptFile('diapos.enc',pw));
  document.open(); document.write(html); document.close();
});
</script>
</body>
</html>
